<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>동해 명소 좌표 찍기</title>
<style>
  :root{color-scheme:light}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Apple SD Gothic Neo",system-ui,sans-serif;color:#15232e;background:#eef3f5}
  header{padding:14px 16px 10px}
  h1{font-size:1.15rem;margin:0 0 6px}
  .hint{color:#4a5d68;font-size:.92rem;margin:0 0 10px;line-height:1.5}
  .now{background:#0e7c8b;color:#fff;font-weight:700;padding:10px 14px;border-radius:10px;font-size:1.05rem;margin:0 16px}
  .now small{font-weight:400;opacity:.85}
  #map{width:100%;height:60vh;min-height:360px}
  .out{margin:12px 16px}
  textarea{width:100%;height:170px;font-family:ui-monospace,monospace;font-size:.95rem;padding:10px;border:1px solid #cdd9df;border-radius:10px;background:#fff}
  .btns{display:flex;gap:10px;margin:0 16px 22px}
  button{flex:1;padding:12px 0;font-size:1rem;font-weight:700;border:0;border-radius:10px;cursor:pointer}
  .copy{background:#df5f38;color:#fff}
  .reset{background:#8aa0ab;color:#fff}
  .done{color:#0e7c8b;font-weight:700}
</style>
</head>
<body>
<header>
  <h1>동해 명소 좌표 찍기</h1>
  <p class="hint">아래 '지금 찍을 곳'에 뜬 명소를 지도에서 <b>정확히 한 번 클릭</b>하세요. 클릭하면 다음 명소로 넘어가고, 좌표가 아래 칸에 쌓입니다. 9곳을 다 찍으면 <b>[전체 복사]</b>를 눌러 Claude에게 붙여넣어 주세요.<br>잘못 찍었으면 [처음부터]로 다시 하면 됩니다.</p>
</header>
<div class="now" id="now">지금 찍을 곳 (1/9): <b>추암 촛대바위</b> &nbsp;<small>지도에서 이 위치를 클릭하세요</small></div>
<div id="map"></div>
<div class="out"><textarea id="out" readonly placeholder="여기에 좌표가 쌓입니다"></textarea></div>
<div class="btns">
  <button class="copy" onclick="copyAll()">전체 복사</button>
  <button class="reset" onclick="resetAll()">처음부터</button>
</div>
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=966042d4fa3bd296453851d197ec5f80&autoload=false"></script>
<script>
var NAMES=["추암 촛대바위","무릉계곡","논골담길","도째비골 스카이밸리","묵호등대","묵호항","망상해변","천곡황금박쥐동굴","한섬해변"];
var out=document.getElementById('out'), nowEl=document.getElementById('now');
var lines=[], n=0, map;
function updateNow(){
  if(n>=NAMES.length){ nowEl.innerHTML='<span class="done">다 찍었습니다! [전체 복사]를 눌러 Claude에게 붙여넣어 주세요.</span>'; }
  else nowEl.innerHTML='지금 찍을 곳 ('+(n+1)+'/9): <b>'+NAMES[n]+'</b> &nbsp;<small>지도에서 이 위치를 클릭하세요</small>';
}
kakao.maps.load(function(){
  map=new kakao.maps.Map(document.getElementById('map'),{center:new kakao.maps.LatLng(37.5247,129.1140),level:8});
  map.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);
  kakao.maps.event.addListener(map,'click',function(e){
    if(n>=NAMES.length) return;
    var ll=e.latLng;
    var mk=new kakao.maps.Marker({map:map,position:ll});
    new kakao.maps.CustomOverlay({map:map,position:ll,yAnchor:2.2,
      content:'<div style="background:#df5f38;color:#fff;padding:2px 7px;border-radius:10px;font-size:12px;font-weight:700">'+(n+1)+'</div>'});
    lines.push((n+1)+'. '+NAMES[n]+' : '+ll.getLat().toFixed(6)+', '+ll.getLng().toFixed(6));
    out.value=lines.join('\n');
    n++; updateNow();
  });
  updateNow();
});
function copyAll(){ out.select(); try{document.execCommand('copy');}catch(e){} }
function resetAll(){ lines=[]; n=0; out.value=''; location.reload(); }
</script>
</body>
</html>
